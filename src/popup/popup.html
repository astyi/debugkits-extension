<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DebugKits API Bridge</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <span class="icon">&#9889;</span>
    <div>
      <div class="title">DebugKits API Bridge</div>
      <div class="version" id="version"></div>
    </div>
  </div>

  <div class="status-row">
    <span class="dot"></span>
    <span>Extension active</span>
  </div>

  <p class="desc">
    Allows the DebugKits API Tester to send HTTP requests without browser
    CORS restrictions. Only responds to requests from debugkits.com.
  </p>

  <a class="cta" href="https://debugkits.com/api-tools/api-tester/" target="_blank">
    Open API Tester &#8599;
  </a>

  <div class="footer">
    This extension does not read or modify your normal browsing activity.
  </div>

  <script src="popup.js"></script>
</body>
</html>
